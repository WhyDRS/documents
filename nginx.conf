server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    index index.html;

    types {
        text/plain md;
        application/pdf pdf;
        text/html html;
        text/css css;
    }

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    # Attachments have opaque .bin names and may not execute as web documents.
    location ^~ /_mail/attachments/ {
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
