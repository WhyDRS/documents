server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    types {
        text/plain md;
        application/pdf pdf;
    }

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
